# GoReleaser config. Validate with `goreleaser check`; build locally with
# `make snapshot`. Releases run in CI on a `v*` tag (see .github/workflows/release.yml).
version: 2

project_name: notenv

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: notenv
    main: ./cmd/notenv
    binary: notenv
    env:
      - CGO_ENABLED=0 # pure-Go; static binaries, trivial cross-compile
    flags:
      - -trimpath # strip local paths for reproducible builds
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: stamp from the commit, not build time
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: notenv
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Keyless cosign signature over the checksums file. Verifiers can confirm an
# artifact's hash against checksums.txt, then confirm checksums.txt was signed
# by a release run of this repo. Requires id-token: write in the workflow.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      # cosign 3.x defaults to the new single-file bundle and ignores the
      # separate signature/certificate outputs. Opt back into the two-file
      # output that GoReleaser uploads and the README verifies.
      - "--new-bundle-format=false"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: DvGils
    name: notenv
  draft: false
  prerelease: auto
  footer: >-
    ---

    Built reproducibly with GoReleaser. Artifacts are signed with cosign
    (keyless) and carry SLSA build provenance.

# Additional distribution channels (Homebrew tap, AUR, Scoop) plug in here.
# Each needs external setup (a tap repo / AUR account / Scoop bucket) before
# it can be enabled.
