name: nightly-fuzz

# Long-budget fuzzing of every fuzz target in internal/secrets, nightly. Unlike the PR
# smokes (30s, minimization bounded to one run), these runs keep Go's default
# minimization: the goal is a corpus that improves overnight, not breadth in a
# fixed window. The harnesses run against the in-memory store, so this is pure
# protocol-path exploration at full speed — real-remote behavior is the
# (separate) soak workflow's job.
#
# The working corpus persists between nights via the actions cache (always
# saved, even when a run finds a crash, so the find is never lost) and
# compounds on top of the curated seeds in testdata/fuzz/. A crashing input is
# minimized by Go into testdata/fuzz/<Target>/ and uploaded as an artifact, to
# be committed as a regression seed with the fix.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # Scheduled runs should burn no one's minutes but ours, forks included.
    if: github.repository == 'DvGils/notenv'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: restore the working corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # Every fuzz target gets its own long budget. The loop runs them all even
      # when one finds a crash (so the corpus save and crasher upload below still
      # capture everything), then fails the job at the end. A name that matches no
      # target also fails: `go test -fuzz` exits 0 with "no fuzz tests to fuzz",
      # which is how the old log-era targets silently stopped fuzzing after 0.18.
      - name: fuzz
        run: |
          set -uo pipefail
          failed=""
          for entry in \
            internal/secrets:FuzzWriteReadRoundTrip \
            internal/secrets:FuzzReadDecodeNeverPanics \
            internal/secrets:FuzzCommitSequence \
            internal/secrets:FuzzMultiWriterCommit \
            internal/runner:FuzzMaskerMatchesReference; do
            pkg="${entry%%:*}"; tgt="${entry##*:}"
            echo "::group::$tgt"
            out=$(go test -tags fastkdf -run='^$' -fuzz="^${tgt}\$" -fuzztime=20m "./${pkg}/" 2>&1)
            status=$?
            echo "$out"
            echo "::endgroup::"
            if printf '%s\n' "$out" | grep -q "no fuzz tests to fuzz"; then
              echo "::error::$tgt matched no fuzz target (renamed or removed?)"
              failed="$failed $tgt(missing)"
            elif [ "$status" -ne 0 ]; then
              failed="$failed $tgt"
            fi
          done
          if [ -n "$failed" ]; then
            echo "fuzzing found failures in:$failed (crashing inputs in the run artifacts)"
            exit 1
          fi
      - name: save the working corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
      - name: collect crashing inputs
        if: always()
        run: |
          mkdir -p /tmp/crashers
          for f in $(git ls-files --others --exclude-standard internal/secrets/testdata/fuzz internal/runner/testdata/fuzz); do
            mkdir -p "/tmp/crashers/$(dirname "$f")"
            cp "$f" "/tmp/crashers/$f"
          done
      - name: upload crashing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers
          path: /tmp/crashers
          if-no-files-found: ignore
