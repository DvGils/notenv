name: nightly-fuzz

# Long-budget fuzzing of the three simulation targets, nightly. Unlike the PR
# smokes (30s, minimization bounded to one run), these runs keep Go's default
# minimization: the goal is a corpus that improves overnight, not breadth in a
# fixed window. The harnesses run against the in-memory store, so this is pure
# protocol-path exploration at full speed — real-remote behavior is the
# (separate) soak workflow's job.
#
# The working corpus persists between nights via the actions cache (always
# saved, even when a run finds a crash, so the find is never lost) and
# compounds on top of the curated seeds in testdata/fuzz/. A crashing input is
# minimized by Go into testdata/fuzz/<Target>/ and uploaded as an artifact, to
# be committed as a regression seed with the fix.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # Scheduled runs should burn no one's minutes but ours, forks included.
    if: github.repository == 'DvGils/notenv'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: restore the working corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: fuzz the secret log
        id: secret
        continue-on-error: true
        run: go test -run='^$' -fuzz='^FuzzSecretLog$' -fuzztime=20m ./internal/secrets/
      - name: fuzz rotation interleavings
        id: rotation
        continue-on-error: true
        run: go test -run='^$' -fuzz='^FuzzRotationLog$' -fuzztime=20m ./internal/secrets/
      - name: fuzz storage-level attacks
        id: adversary
        continue-on-error: true
        run: go test -run='^$' -fuzz='^FuzzAdversaryLog$' -fuzztime=20m ./internal/secrets/
      - name: save the working corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
      - name: collect crashing inputs
        if: always()
        run: |
          mkdir -p /tmp/crashers
          for f in $(git ls-files --others --exclude-standard internal/secrets/testdata/fuzz); do
            mkdir -p "/tmp/crashers/$(dirname "$f")"
            cp "$f" "/tmp/crashers/$f"
          done
      - name: upload crashing inputs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: crashers
          path: /tmp/crashers
          if-no-files-found: ignore
      - name: report
        run: |
          failed=""
          [ "${{ steps.secret.outcome }}" = "failure" ] && failed="$failed FuzzSecretLog"
          [ "${{ steps.rotation.outcome }}" = "failure" ] && failed="$failed FuzzRotationLog"
          [ "${{ steps.adversary.outcome }}" = "failure" ] && failed="$failed FuzzAdversaryLog"
          if [ -n "$failed" ]; then
            echo "fuzzing found failures in:$failed (crashing inputs in the run artifacts)"
            exit 1
          fi
