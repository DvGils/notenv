name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # golangci-lint runs gofmt, go vet, gocyclo, ineffassign, gosec and the rest
      # of the set configured in .golangci.yml. The action is pinned by commit SHA
      # and golangci-lint itself is pinned to an exact release for reproducibility.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Guard the production scrypt cost in an untagged build: this fails if a
      # release would ship the fastkdf work factor. Cheap (no scrypt, one test).
      - name: production scrypt work factor
        run: go test -run TestProductionScryptWorkFactor ./internal/crypto/
      # The suite runs with -tags fastkdf: scrypt at 2^19 otherwise dominates the
      # run (~80s for the crypto package alone, far more under -race). The tag drops
      # the work factor to a near-instant cost for tests only; the guard above keeps
      # production at 2^19. The work factor is a cost parameter, not a correctness
      # one, so every code path is still exercised.
      - name: test
        run: go test -tags fastkdf -race ./...
      # govulncheck is a tool dependency in go.mod, so its version and hash are
      # pinned by go.sum like every other module. It reports only vulnerabilities
      # that reachable code actually calls, so a finding here is real, not advisory.
      - name: govulncheck
        run: go tool govulncheck ./...

  # The native key caches (Keychain, DPAPI) and everything platform-shaped
  # only prove themselves by running, not cross-compiling.
  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Runner keychains start locked; the cache tests need a usable default.
      - name: unlock a keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          # Disable the auto-lock timeout for the run. create-keychain leaves a
          # ~5-minute lock timer; once the suite runs past it the keychain relocks
          # and the next `security add-generic-password` blocks on an unanswerable
          # GUI unlock prompt, hanging the native-cache test until it times out
          # (the early keyring tests pass only because they run before it relocks).
          # A timeout longer than the job keeps it unlocked throughout.
          security set-keychain-settings -lut 21600 ci.keychain
      # This job provisions a working native store, so a Store failure here is a
      # real regression (e.g. the macOS Keychain write that feeds the key over
      # stdin), not an unsupported environment: assert hard instead of skipping.
      - name: test
        run: go test -tags fastkdf ./...
        env:
          NOTENV_TEST_REQUIRE_NATIVE_CACHE: "1"

  # The rclone backend shells out to a real rclone for every cloud operation, so
  # the only honest test of that seam is a real rclone, not the in-memory fake the
  # default suite runs against. The conformance contracts already know how to run
  # against rclone's built-in on-the-fly local backend (`:local`), which needs no
  # remote or credentials, so a stock rclone exercises runRclone, the hand-rolled
  # SwapHeader compare-and-swap, backup/restore, and the lsf listing end to end,
  # and proves the in-memory fake still models the real backend. The base trims to
  # a relative path, so the scratch lands under the gitignored internal/backend/tmp/.
  # The distro rclone is a stable baseline (the operations under test predate it by
  # years); a soak against a real B2/S3 remote is a separate, credentialed job.
  backend-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: rclone version
        run: rclone version
      - name: conformance (real rclone via :local)
        env:
          NOTENV_TEST_REMOTE: ":local"
          NOTENV_TEST_BASE: "/tmp/notenv-conformance"
        run: go test -race ./internal/backend/...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Short mutation smokes over every fuzz target in internal/secrets.
      # minimizetime is bounded to one run: the default (60s per new interesting
      # input) makes the workers spend the whole budget minimizing their first
      # finds instead of fuzzing. The curated corpus under testdata/fuzz/ replays
      # deterministically in the regular test job; these steps add live mutation
      # on top. A name matching no target FAILS the job: `go test -fuzz` exits 0
      # with "no fuzz tests to fuzz", so without this guard a renamed or removed
      # target would rot silently into a vacuous pass (it did, after 0.18).
      - name: fuzz (short smoke)
        run: |
          set -uo pipefail
          for entry in \
            internal/secrets:FuzzWriteReadRoundTrip \
            internal/secrets:FuzzReadDecodeNeverPanics \
            internal/secrets:FuzzCommitSequence \
            internal/secrets:FuzzMultiWriterCommit \
            internal/runner:FuzzMaskerMatchesReference; do
            pkg="${entry%%:*}"; tgt="${entry##*:}"
            echo "::group::$tgt"
            out=$(go test -tags fastkdf -run='^$' -fuzz="^${tgt}\$" -fuzztime=30s -fuzzminimizetime=1x "./${pkg}/" 2>&1)
            status=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$status" -ne 0 ] || printf '%s\n' "$out" | grep -q "no fuzz tests to fuzz"; then
              echo "::error::fuzz smoke failed or matched no target: $tgt"
              exit 1
            fi
          done

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: build (linux/darwin/windows)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... || exit 1
          done

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: check
