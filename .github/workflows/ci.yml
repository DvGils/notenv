name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      # gocyclo and ineffassign are tool dependencies in go.mod, so their
      # versions and hashes are pinned by go.sum like every other module.
      - name: gocyclo
        run: go tool gocyclo -over 15 .
      - name: ineffassign
        run: go tool ineffassign ./...
      - name: test
        run: go test -race ./...

  # The native key caches (Keychain, DPAPI) and everything platform-shaped
  # only prove themselves by running, not cross-compiling.
  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Runner keychains start locked; the cache tests need a usable default.
      - name: unlock a keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
      # This job provisions a working native store, so a Store failure here is a
      # real regression (e.g. the macOS Keychain write that feeds the key over
      # stdin), not an unsupported environment: assert hard instead of skipping.
      - name: test
        run: go test ./...
        env:
          NOTENV_TEST_REQUIRE_NATIVE_CACHE: "1"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # Short mutation smokes. minimizetime is bounded to one run: the default
      # (60s per new interesting input) makes the workers spend the entire
      # budget minimizing their first finds instead of fuzzing — observed as
      # the exec counter freezing single-digit. The curated corpus under
      # testdata/fuzz/ replays deterministically in the regular test job; these
      # steps only add mutation on top.
      - name: fuzz the secret log (short smoke)
        run: go test -run='^$' -fuzz='^FuzzSecretLog$' -fuzztime=30s -fuzzminimizetime=1x ./internal/secrets/
      - name: fuzz rotation interleavings (short smoke)
        run: go test -run='^$' -fuzz='^FuzzRotationLog$' -fuzztime=30s -fuzzminimizetime=1x ./internal/secrets/
      - name: fuzz storage-level attacks (short smoke)
        run: go test -run='^$' -fuzz='^FuzzAdversaryLog$' -fuzztime=30s -fuzzminimizetime=1x ./internal/secrets/

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: build (linux/darwin/windows)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... || exit 1
          done

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: check
