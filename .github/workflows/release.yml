name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # keyless cosign signing + provenance (OIDC)
  attestations: write # SLSA build provenance attestations

jobs:
  release:
    runs-on: ubuntu-latest
    # Gated on the protected `release` environment: the job pauses for manual
    # approval before it builds, signs, or publishes anything, so a pushed tag
    # cannot ship a release on its own.
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft on PATH for GoReleaser's `sboms:` step (one SPDX SBOM per archive).
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The GitHub release body is the curated CHANGELOG.md section for this tag,
      # not GoReleaser's auto commit list. Extract it for --release-notes below.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / { if (found) exit; if ($2 == ver) { found=1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf "Release %s. See https://github.com/DvGils/notenv/blob/%s/CHANGELOG.md\n" "$version" "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        with:
          # Pinned to an exact GoReleaser release (its tags are immutable), so a
          # rebuild uses byte-identical tooling. Bump manually: dependabot updates
          # the action SHA above, not this version input.
          version: "v2.16.0"
          args: release --clean --release-notes=RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PyPI wheels carrying the exact binaries GoReleaser just built, so the
      # `uv tool install notenv` artifact is byte-identical to the released
      # one. The builder is a stdlib-only script; SOURCE_DATE_EPOCH makes the
      # wheels reproducible. Publishing authenticates via PyPI Trusted
      # Publishing (OIDC from this workflow + the `release` environment; no
      # token secret exists).
      - name: Build PyPI wheels
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 scripts/build-wheels.py --version "${GITHUB_REF_NAME#v}" --dist dist --out dist/wheels

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/wheels

      # SLSA build provenance for each released archive and wheel.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/notenv_*.tar.gz
            dist/notenv_*.zip
            dist/wheels/*.whl
